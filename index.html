<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de liquidación de Sabores Funky. Ropa para bebé con fotos, precios, descuentos y tallas por modelo.">
  <title>Sabores Funky | Catálogo de liquidación</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="catalogo.js" defer></script>
</head>
<body id="inicio">
  <header class="site-header wrap">
    <a class="brand" href="#inicio"><span aria-hidden="true">✦</span> Sabores Funky</a>
    <a class="nav-link" href="#coleccion">Ver por productos</a>
  </header>

  <main class="wrap">
    <section class="reader" id="lector" aria-labelledby="titulo">
      <header class="reader-heading">
        <h1 id="titulo">Catálogo de liquidación</h1>
        <a class="button whatsapp-button" id="consulta-whatsapp" href="https://wa.me/51934097593" target="_blank" rel="noopener noreferrer">Consultar por WhatsApp</a>
      </header>
      <div class="reader-toolbar">
        <div class="reader-modes" role="group" aria-label="Modo de lectura">
          <button type="button" id="modo-continuo" aria-pressed="true">Vista continua</button>
          <button type="button" id="modo-libro" aria-pressed="false">Modo libro</button>
        </div>
        <div class="reader-navigation" aria-label="Navegación del libro" role="group" hidden>
          <button type="button" id="pagina-anterior" aria-label="Página anterior">←</button>
          <select id="numero-pagina" aria-label="Ir a la página"></select>
          <button type="button" id="pagina-siguiente" aria-label="Página siguiente">→</button>
        </div>
      </div>
      <div id="paginas-pdf"></div>
      <noscript><p>Activa JavaScript para ver las páginas del catálogo.</p></noscript>
    </section>

    <section class="collection" id="coleccion" aria-labelledby="coleccion-titulo">
      <a class="nav-link" href="#lector">↑ Volver al catálogo original</a>
      <p class="eyebrow"><span></span> Sabores Funky</p>
      <h2 id="coleccion-titulo">Catálogo completo</h2>
      <p class="collection-intro">Los precios y las tallas corresponden a la liquidación del catálogo.</p>
      <nav id="categorias" aria-label="Categorías del catálogo"></nav>
      <div id="productos"></div>
      <noscript><p>Activa JavaScript para ver los productos y sus galerías.</p></noscript>
    </section>
  </main>

  <dialog class="gallery" aria-labelledby="galeria-titulo">
    <header class="gallery-header">
      <h2 id="galeria-titulo"></h2>
      <form method="dialog"><button class="gallery-close" aria-label="Cerrar galería" autofocus>×</button></form>
    </header>
    <figure>
      <img id="galeria-foto" alt="">
      <figcaption id="galeria-pie" aria-live="polite"></figcaption>
    </figure>
    <div class="gallery-controls">
      <button type="button" id="galeria-anterior">← Anterior</button>
      <button type="button" id="galeria-siguiente">Siguiente →</button>
    </div>
  </dialog>

  <footer class="site-footer wrap">
    <p class="brand"><span aria-hidden="true">✦</span> Sabores Funky</p>
    <a class="nav-link" href="#inicio">Volver arriba ↑</a>
  </footer>
</body>
</html>
